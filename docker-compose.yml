services:
  request-viewer:
    build: .
    container_name: request-viewer
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    # Valores tomados del fichero .env (ver .env.example)
    environment:
      PORT: ${PORT:-8080}
      CAPTURE_PATHS: ${CAPTURE_PATHS:-/test}
      CAPTURE_METHODS: ${CAPTURE_METHODS:-POST}
      MAX_REQUESTS: ${MAX_REQUESTS:-500}
      MAX_BODY: ${MAX_BODY:-10mb}
      RESPONSE_STATUS: ${RESPONSE_STATUS:-200}
      INFO_USER: ${INFO_USER:-admin}
      INFO_PASSWORD: ${INFO_PASSWORD:-}
    restart: unless-stopped
